sources:
  google:
    enabled: true
    poll_interval_minutes: 5
    credentials_path: "./credentials/google-credentials.json"
    token_path: "./credentials/google-token.json"
    lists:
      - source_list_id: "MTY2OTQ4MjQxMTE1MjE0ODAyODg6MDow"
        todoist_project_id: "inbox"
        delete_after_sync: true
      - source_list_id: "NDNqUnZ4alhWaW43U2pKdw"
        todoist_project_id: "6gqV8xFH3xfcF84Q"
        delete_after_sync: true

  alexa:
    enabled: true
    poll_interval_minutes: 5
    cookie_path: "./credentials/alexa-cookie.json"
    amazon_page: "amazon.com"
    lists:
      - source_list_id: "all"
        todoist_project_id: "inbox"
        delete_after_sync: false
    sync_shopping_list:
      enabled: true
      todoist_project_id: "6gqV8xFH3xfcF84Q"
      delete_after_sync: false

  microsoft:
    enabled: false

storage:
  database_path: "./data/sync.db"

logging:
  level: "info"
